name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: chip-backend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chip-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chip-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Test with coverage (target >= 80%)
        run: npm run test:cov

  frontend:
    name: chip-frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chip-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chip-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
